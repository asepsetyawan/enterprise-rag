services:
  prometheus:
    image: prom/prometheus:v3.5.0
    user: '${RAG_UID:-10001}:${RAG_GID:-10001}'
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=30d]
    ports: ['127.0.0.1:9090:9090']
    volumes: ['./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro','./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro','./data/prometheus:/prometheus']
    secrets: [metrics_token]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: ['./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro']
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    user: '${RAG_UID:-10001}:${RAG_GID:-10001}'
    ports: ['127.0.0.1:3000:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/metrics_token
    secrets: [metrics_token]
    volumes: ['./infra/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/rag.yml:ro','./data/grafana:/var/lib/grafana']
    restart: unless-stopped
  otel:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes: ['./infra/monitoring/otel.yml:/etc/otelcol-contrib/config.yaml:ro']
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.8.2
    user: '${RAG_UID:-10001}:${RAG_GID:-10001}'
    command: [-config.file=/etc/tempo.yml]
    volumes: ['./infra/monitoring/tempo.yml:/etc/tempo.yml:ro','./data/tempo:/var/tempo']
    restart: unless-stopped
  worker:
    environment: {METRICS_BIND: '0.0.0.0'}
