[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Tenant-aware internal knowledge platform using LightRAG, PostgreSQL, OIDC and local Ollama"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightrag-hku[api]==1.5.7",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "asyncpg>=0.31,<1",
  "pgvector>=0.4,<1",
  "alembic>=1.16,<2",
  "authlib>=1.6,<2",
  "pyjwt[crypto]>=2.10,<3",
  "itsdangerous>=2.2,<3",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.35,<2",
  "opentelemetry-sdk>=1.35,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.35,<2",
  "docling==2.140.0",
  "docling-core[chunking-openai]==2.102.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.12,<1"]

[project.scripts]
rag-admin = "rag_platform.cli:main"
rag-worker = "rag_platform.worker:main"
rag-evaluate = "rag_platform.evaluate:main"
rag-prepare-parser = "rag_platform.parsing:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires PostgreSQL", "live: requires real Ollama and LightRAG"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
