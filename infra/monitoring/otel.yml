receivers:
  otlp:
    protocols:
      http: {endpoint: '0.0.0.0:4318'}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 256}
  batch: {}
  attributes/privacy:
    actions:
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: db.statement, action: delete}
exporters:
  otlphttp/tempo: {endpoint: 'http://tempo:4318'}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/tempo]
