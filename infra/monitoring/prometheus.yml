global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    authorization: {credentials_file: /run/secrets/metrics_token}
    static_configs: [{targets: ['api:8088']}]
  - job_name: rag-gateway
    authorization: {credentials_file: /run/secrets/metrics_token}
    static_configs: [{targets: ['gateway:8091']}]
  - job_name: rag-worker
    authorization: {credentials_file: /run/secrets/metrics_token}
    static_configs: [{targets: ['worker:8093']}]
alerting:
  alertmanagers: [{static_configs: [{targets: ['alertmanager:9093']}]}]
