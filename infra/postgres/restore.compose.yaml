services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    ports: ['127.0.0.1:15433:5432']
    volumes: ['restore_probe:/var/lib/postgresql']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 30
secrets:
  pg_password: {file: ../../.secrets/pg_password}
volumes: {restore_probe: {}}
